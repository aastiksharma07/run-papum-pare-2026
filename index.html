                  <rect class="logo-reveal-sweep" width="2568" height="1003" fill="url(#logo-soft-edge)"/>

              <g class="logo-reveal" mask="url(#logo-reveal-mask)"><g mask="url(#logo-without-runner)"><use href="#logo-source"/></g></g>
